name: ERP risk MLOps unit tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install CPU-only test dependencies
        run: python -m pip install --disable-pip-version-check xgboost-cpu==3.4.1 scikit-learn==1.9.0
      - name: Run project unit tests
        env:
          PYTHONPATH: src:scripts
        run: python -m unittest discover -s tests -v
